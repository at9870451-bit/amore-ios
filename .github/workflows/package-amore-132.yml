name: Package verified Amore 1.32
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Fixed packaging source
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          repository: at9870451-bit/OpenMinis
          ref: ${{ inputs.source_sha }}
      - name: Verify source provenance
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:src)" = 084b7c4bb1700b7ca18546454d0e7c2d0874b44c
          test "$(git rev-parse HEAD:deps)" = 3b15158b6aeb7392375454d35181a5100cd13276
          test "$(git rev-parse HEAD:vendor/poki)" = 1a60222c73cad7389e9c8440d8324ae043c74110
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: at9870451-bit/amore-ios
          run-id: 44216678152
          name: original-poki-132
          path: original-frameworks
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: at9870451-bit/amore-ios
          run-id: 44211774088
          name: amore-132-host
          path: host
      - name: Embed, verify and package
        run: |
          set -euo pipefail
          mkdir -p Payload
          tar -xzf host/Amore-132-host.tar.gz -C Payload
          python3 scripts/embed-poki-original.py Payload/Minis.app original-frameworks
          python3 scripts/restore-piswift-resources.py Payload/Minis.app
          python3 scripts/verify-poki-ipa.py Payload/Minis.app | tee package-verification.json
          xcrun otool -L Payload/Minis.app/Frameworks/Poki.framework/Poki > framework-links.txt
          printf '%s\n' '${{ inputs.source_sha }}' > source-commit.txt
          printf '%s\n' 'Host compiled in run 44211774088, unchanged src/deps trees; original framework compiled in run 44216678152, unchanged vendor tree; 288 PokiCore tests passed in run 44211774088' > build-provenance.txt
          zip -qry Amore-1.32-Poki-Original.ipa Payload
          unzip -tq Amore-1.32-Poki-Original.ipa
          shasum -a 256 Amore-1.32-Poki-Original.ipa | tee IPA-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Amore-1.32-Poki-Original
          path: |
            Amore-1.32-Poki-Original.ipa
            IPA-SHA256.txt
            source-commit.txt
            package-verification.json
            framework-links.txt
            build-provenance.txt
          retention-days: 7
          if-no-files-found: error
