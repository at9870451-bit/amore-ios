name: Finish Amore1.40 compiled original Poki phone core
'on':
  workflow_dispatch:
    inputs:
      source_sha:
        description: Fixed fusion source SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  app:
    name: Final Amore 1.40 compiled from restored 1.38
    runs-on: macos-15-intel
    timeout-minutes: 110
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
    - uses: actions/checkout@v4
      with:
        repository: at9870451-bit/OpenMinis
        ref: ${{ inputs.source_sha }}
        submodules: recursive
    - name: Verify source-matched native kit and all real gates
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\npython3 - <<'PY'\nimport json,os,urllib.request\nroot='https://api.github.com/repos/at9870451-bit/'\ndef get(path):\n req=urllib.request.Request(root+path,headers={'Authorization':'Bearer\
        \ '+os.environ['GH_TOKEN']})\n with urllib.request.urlopen(req,timeout=60) as f:return json.load(f)\ns=os.environ['SOURCE_SHA'];b='d5d40a09bd79299389cf0e0a647190c224bc8642'\n\
        a=get('OpenMinis/git/commits/'+b);c=get('OpenMinis/git/commits/'+s)\nt=lambda sha:{x['path']:x['sha'] for x in get('OpenMinis/git/trees/'+sha)['tree'] if\
        \ x['path'] in ('src','vendor','deps')}\nassert t(a['tree']['sha'])==t(c['tree']['sha']), 'Same production source is required'\njobs=get('amore-ios/actions/runs/44791314837/jobs?per_page=100')['jobs']\n\
        for name in ['Rebuild PokiCore PokiNative launcher and app icon bridge','Real VoiceSessionManager lifecycle regression','Production SSE tool completion offline\
        \ fixtures','Pure chat and Poki phone-route real XCTest','Actual Swift connection monitor regression','Exact production device wake and foreground lifecycle\
        \ regression']:\n assert any(j['name']==name and j['conclusion']=='success' for j in jobs),name\nassert get('amore-ios/actions/runs/44795023380')['conclusion']=='success','Fixed\
        \ UI test gate'\nprint('PASS source-matched rebuilt Poki kit, pure mode, phone route, voice, connection, lifecycle, UI')\nPY"
    - uses: actions/download-artifact@v4
      with:
        name: amore140-static-services
        path: deps/AmoreDeviceKit
        repository: at9870451-bit/amore-ios
        run-id: 44791314837
        github-token: ${{ github.token }}
    - uses: actions/setup-go@v5
      with:
        go-version: 1.25.5
        cache: false
    - name: Tools and original runtime regression checks
      run: 'brew install ninja llvm lld libarchive pkg-config meson

        cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig

        python3 scripts/test-node-online-source.py

        python3 scripts/test-amore136-performance-policy.py

        python3 scripts/test-amore136-settings-source.py

        swift scripts/Amore135AvatarPipelineTests.swift .

        swift test --package-path src/ios/Packages/AmorePluginArchive 2>&1 | tee fusion-archive-tests.log

        bash scripts/test-plugin-import.sh


        python3 scripts/test-amore140-policy.py

        python3 scripts/test-amore-app-capsules.py

        '
    - uses: actions/cache@v4
      with:
        path: 'deps/lame-build

          deps/ffmpeg-6.1.2

          deps/frameworks

          deps/ish/build-ios

          deps/libs

          deps/include

          deps/resources

          deps/build/rclone

          '
        key: native-deps-v2-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('deps/*.sh') }}
    - name: Verify online-only Node source and remove stale bundle
      run: 'python3 scripts/test-node-online-source.py

        test ! -d src/ios/NodeRuntime

        '
    - name: Build native runtime
      run: 'set -euo pipefail

        chmod -R +x deps scripts

        export PATH="$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"

        bash deps/build_lame.sh

        bash deps/build_ffmpeg.sh

        bash deps/build_ish.sh

        mkdir -p deps/resources

        curl -fL --retry 3 https://github.com/at9870451-bit/amore-ios/releases/download/rootfs-v1/alpine-rootfs.zip -o deps/resources/alpine-rootfs.zip

        printf ''%s\n'' ''84f8d8acff68a28a0773298f67b3bed29c726f67fdb8c0f1cab8f01991a952cf  deps/resources/alpine-rootfs.zip'' | shasum -a 256 -c -

        bash deps/build_rclone_ios.sh

        '
    - name: Compile fused Amore
      run: 'set -o pipefail

        xcodebuild -project src/ios/Minis.xcodeproj -scheme Minis -configuration Release -derivedDataPath build -destination ''generic/platform=iOS'' CODE_SIGNING_ALLOWED=NO
        build 2>&1 | tee fusion-app-build.log

        '
    - name: Verify absence of embedded Poki app and package
      run: 'set -euo pipefail

        mkdir -p Payload

        ditto build/Build/Products/Release-iphoneos/Minis.app Payload/Minis.app

        python3 scripts/package-amore-fusion.py Payload/Minis.app deps/AmoreDeviceKit

        zip -qry Amore-1.40-Poki-Core-Capsule.ipa Payload

        unzip -tq Amore-1.40-Poki-Core-Capsule.ipa

        shasum -a 256 Amore-1.40-Poki-Core-Capsule.ipa | tee FUSION-SHA256.txt

        printf ''%s\n'' ''${{ inputs.source_sha }}'' > fusion-source.txt

        '
    - uses: actions/upload-artifact@v4
      with:
        name: Amore-1.40-Poki-Core-Capsule
        path: 'Amore-1.40-Poki-Core-Capsule.ipa

          FUSION-SHA256.txt

          fusion-source.txt

          fusion-verification.json

          '
        if-no-files-found: error
        retention-days: 7
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: fusion-app-diagnostics
        path: 'fusion-*.log

          plugin-install-tests.log

          '
        if-no-files-found: warn
