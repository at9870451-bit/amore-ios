name: Finish Amore 1.34 Intel build
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Fixed fusion source SHA
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  app:
    name: Single Amore app and data store
    runs-on: macos-15-intel
    timeout-minutes: 110
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          repository: at9870451-bit/OpenMinis
          ref: ${{ inputs.source_sha }}
          submodules: recursive
      - name: Check completed final component test gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          url='https://api.github.com/repos/at9870451-bit/amore-ios/actions/runs/44305474197/jobs'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          data=json.load(urllib.request.urlopen(req))
          jobs=[j for j in data['jobs'] if j['name']=='Real 1.34 marquee drawer avatar components']
          assert jobs and all(j['conclusion']=='success' for j in jobs), 'Final component and UI test gate did not pass'
          print('19 component/data/navigation tests passed on the same source')
          PY
      - name: Check tested static service source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:vendor/poki)" = 97854403ff295679503704d416f27d7ecc9eb25e
          test "$(git rev-parse HEAD:deps)" = 3b15158b6aeb7392375454d35181a5100cd13276
      - uses: actions/download-artifact@v4
        with:
          name: amore-static-services
          path: deps/AmoreDeviceKit
          github-token: ${{ github.token }}
          repository: at9870451-bit/amore-ios
          run-id: 44298837600
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Tools and original runtime regression checks
        run: |
          brew install ninja llvm lld libarchive pkg-config meson
          cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig
          python3 scripts/verify-node-bundle.py
          swift test --package-path src/ios/Packages/AmorePluginArchive 2>&1 | tee fusion-archive-tests.log
          bash scripts/test-plugin-import.sh
      - uses: actions/cache@v4
        with:
          path: |
            deps/lame-build
            deps/ffmpeg-6.1.2
            deps/frameworks
            deps/ish/build-ios
            deps/libs
            deps/include
            deps/resources
            deps/build/rclone
          key: native-deps-v2-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('deps/*.sh') }}
      - name: Build native runtime
        run: |
          set -euo pipefail
          chmod -R +x deps scripts
          export PATH="$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"
          bash deps/build_lame.sh
          bash deps/build_ffmpeg.sh
          bash deps/build_ish.sh
          mkdir -p deps/resources
          curl -fL --retry 3 https://github.com/at9870451-bit/amore-ios/releases/download/rootfs-v1/alpine-rootfs.zip -o deps/resources/alpine-rootfs.zip
          printf '%s\n' '84f8d8acff68a28a0773298f67b3bed29c726f67fdb8c0f1cab8f01991a952cf  deps/resources/alpine-rootfs.zip' | shasum -a 256 -c -
          bash deps/build_rclone_ios.sh
      - name: Compile fused Amore
        run: |
          set -o pipefail
          xcodebuild -project src/ios/Minis.xcodeproj -scheme Minis -configuration Release -derivedDataPath build -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee fusion-app-build.log
      - name: Verify absence of embedded Poki app and package
        run: |
          set -euo pipefail
          mkdir -p Payload
          ditto build/Build/Products/Release-iphoneos/Minis.app Payload/Minis.app
          python3 scripts/package-amore-fusion.py Payload/Minis.app deps/AmoreDeviceKit
          zip -qry Amore-1.34-UI-Fusion.ipa Payload
          unzip -tq Amore-1.34-UI-Fusion.ipa
          shasum -a 256 Amore-1.34-UI-Fusion.ipa | tee FUSION-SHA256.txt
          printf '%s\n' '${{ inputs.source_sha }}' > fusion-source.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Amore-1.34-UI-Fusion
          path: |
            Amore-1.34-UI-Fusion.ipa
            FUSION-SHA256.txt
            fusion-source.txt
            fusion-verification.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fusion-app-diagnostics
          path: |
            fusion-*.log
            plugin-install-tests.log
          if-no-files-found: warn
