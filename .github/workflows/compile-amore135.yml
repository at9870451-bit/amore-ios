name: Compile Amore 1.35 UI and fusion
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Fixed fusion source SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  device:
    name: Static Amore device and UI services
    runs-on: macos-15-intel
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          repository: at9870451-bit/OpenMinis
          ref: ${{ inputs.source_sha }}
      - name: Tools and source checks
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          brew list ripgrep >/dev/null 2>&1 || brew install ripgrep
          rustup update stable --no-self-update
          rustup default stable
          python3 scripts/amore-fusion-static-acceptance.py
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vendor/poki/native/launcher/target
            build-device-kit
          key: amore-fusion-v3-${{ runner.arch }}-${{ inputs.source_sha }}
          restore-keys: |
            amore-fusion-v3-${{ runner.arch }}-
            amore-fusion-v2-${{ runner.arch }}-
            amore-fusion-v1-${{ runner.arch }}-
            poki132-retry-xc26.3-${{ runner.arch }}-
      - name: Compile statically linked device services
        run: bash scripts/build-amore-device-kit.sh
      - uses: actions/upload-artifact@v4
        with:
          name: amore-static-services
          path: deps/AmoreDeviceKit
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fusion-device-diagnostics
          path: |
            device-*.log
            device-*.txt
            deps/AmoreDeviceKit/static-link-inputs.json
          if-no-files-found: warn
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vendor/poki/native/launcher/target
            build-device-kit
          key: amore-fusion-v3-${{ runner.arch }}-${{ inputs.source_sha }}
  app:
    name: Single Amore app and data store
    needs: [device, components]
    runs-on: macos-15-intel
    timeout-minutes: 110
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          repository: at9870451-bit/OpenMinis
          ref: ${{ inputs.source_sha }}
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: amore-static-services
          path: deps/AmoreDeviceKit
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Tools and original runtime regression checks
        run: |
          brew install ninja llvm lld libarchive pkg-config meson
          cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig
          python3 scripts/verify-node-bundle.py
          swift test --package-path src/ios/Packages/AmorePluginArchive 2>&1 | tee fusion-archive-tests.log
          bash scripts/test-plugin-import.sh
      - uses: actions/cache@v4
        with:
          path: |
            deps/lame-build
            deps/ffmpeg-6.1.2
            deps/frameworks
            deps/ish/build-ios
            deps/libs
            deps/include
            deps/resources
            deps/build/rclone
          key: native-deps-v2-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('deps/*.sh') }}
      - name: Verify online-only Node source and remove stale bundle
        run: |
          python3 scripts/test-node-online-source.py
          test ! -d src/ios/NodeRuntime
      - name: Build native runtime
        run: |
          set -euo pipefail
          chmod -R +x deps scripts
          export PATH="$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"
          bash deps/build_lame.sh
          bash deps/build_ffmpeg.sh
          bash deps/build_ish.sh
          mkdir -p deps/resources
          curl -fL --retry 3 https://github.com/at9870451-bit/amore-ios/releases/download/rootfs-v1/alpine-rootfs.zip -o deps/resources/alpine-rootfs.zip
          printf '%s\n' '84f8d8acff68a28a0773298f67b3bed29c726f67fdb8c0f1cab8f01991a952cf  deps/resources/alpine-rootfs.zip' | shasum -a 256 -c -
          bash deps/build_rclone_ios.sh
      - name: Compile fused Amore
        run: |
          set -o pipefail
          xcodebuild -project src/ios/Minis.xcodeproj -scheme Minis -configuration Release -derivedDataPath build -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee fusion-app-build.log
      - name: Verify absence of embedded Poki app and package
        run: |
          set -euo pipefail
          mkdir -p Payload
          ditto build/Build/Products/Release-iphoneos/Minis.app Payload/Minis.app
          python3 scripts/package-amore-fusion.py Payload/Minis.app deps/AmoreDeviceKit
          zip -qry Amore-1.35-UI-Fusion.ipa Payload
          unzip -tq Amore-1.35-UI-Fusion.ipa
          shasum -a 256 Amore-1.35-UI-Fusion.ipa | tee FUSION-SHA256.txt
          printf '%s\n' '${{ inputs.source_sha }}' > fusion-source.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Amore-1.35-UI-Fusion
          path: |
            Amore-1.35-UI-Fusion.ipa
            FUSION-SHA256.txt
            fusion-source.txt
            fusion-verification.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fusion-app-diagnostics
          path: |
            fusion-*.log
            plugin-install-tests.log
          if-no-files-found: warn

  components:
    name: Real 1.35 marquee drawer avatar components
    runs-on: macos-15-intel
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          repository: at9870451-bit/OpenMinis
          ref: ${{ inputs.source_sha }}
      - name: Real UI component tests and light-dark snapshots
        env:
          AMORE134_TEST_LOG: ${{ github.workspace }}/amore135-components.log
          AMORE134_SNAPSHOTS: ${{ github.workspace }}/amore135-component-snapshots
        run: bash scripts/test-amore134-components.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amore135-components
          path: |
            amore135-components.log
            amore135-component-snapshots
          if-no-files-found: warn
