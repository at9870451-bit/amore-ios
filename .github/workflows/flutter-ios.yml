name: Flutter iOS IPA

# Public repository → GitHub-hosted macOS minutes are free (they do not draw
# from the account's 2,000-minute private quota). The sources live in the
# OpenMinis fork, so this job clones them instead of duplicating ~4,000 files.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build Amore (Flutter + Rust)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout (workflow only)
        uses: actions/checkout@v4

      - name: Clone sources from the OpenMinis fork
        run: |
          rm -rf src
          git clone --depth 1 --branch feat/ios-build \
            https://github.com/at9870451-bit/OpenMinis.git src
          ls src/flutter_skeleton

      - name: Init submodules (iSH kernel)
        working-directory: src
        run: |
          git submodule update --init --recursive
          ls deps/ish | head -3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Install build tools
        run: |
          brew install ninja llvm lld libarchive pkg-config meson >/dev/null
          # deps/build_ish.sh probes for meson on PATH the way pip installs it;
          # make the brew one discoverable under both names.
          sudo ln -sf "$(command -v meson)" /usr/local/bin/meson || true
          export PATH="/opt/homebrew/bin:$PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          meson --version
          python3 -c "import mesonbuild" 2>/dev/null || pip3 install --break-system-packages meson || true
          cargo install flutter_rust_bridge_codegen --version 2.7.0 --locked

      - name: Build iSH static libraries
        working-directory: src
        env:
          PATH: /opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          chmod -R +x deps scripts || true
          ./deps/build_ish.sh
          ls -lh deps/libs/*.a

      - name: Rust unit tests
        working-directory: src/flutter_skeleton/rust
        run: cargo test -- --nocapture

      - name: Generate bridge + Drift code
        working-directory: src/flutter_skeleton/app
        run: |
          flutter create --platforms=ios --org com.openamroe .
          rm -f test/widget_test.dart
          flutter pub get
          mkdir -p lib/src/rust
          flutter_rust_bridge_codegen generate
          dart run build_runner build --delete-conflicting-outputs

      - name: Flutter tests
        working-directory: src/flutter_skeleton/app
        run: |
          (cd ../rust && cargo build --release)
          cp ../rust/target/release/libamore_core.dylib . || true
          DYLD_LIBRARY_PATH="$PWD:../rust/target/release" flutter test -r expanded

      - name: Build Rust core for iOS
        working-directory: src/flutter_skeleton/rust
        run: |
          set -e
          cargo build --release --target aarch64-apple-ios
          ls -lh target/aarch64-apple-ios/release/libamore_core.a

      - name: Link iSH archives + pod install
        working-directory: src/flutter_skeleton/app
        run: |
          mkdir -p ios/ish_host
          # The Rust core must be linked into the app binary: frb resolves its
          # symbols via DynamicLibrary.process(), so an unlinked staticlib gives
          # a blank/broken app on device.
          cp ../rust/target/aarch64-apple-ios/release/libamore_core.a ios/ish_host/
          cp ../../deps/libs/*.a ios/ish_host/ || true
          cp ../native/ios/ish_host/*.h ../native/ios/ish_host/*.c \
             ../native/ios/ish_host/*.m ../native/ios/ish_host/*.podspec ios/ish_host/ || true
          cp -r ../native/ios/ish_host/stubs ios/ish_host/ || true
          # Kernel wrappers: the only app-coupled file is ISHKernel.m, whose two
          # host imports are redirected to the stubs.
          cp ../../src/ios/iSH/ISHKernel.h ../../src/ios/iSH/ISHShellExecutor.h \
             ../../src/ios/iSH/CurrentRoot.h ios/ish_host/
          cp ../../src/ios/iSH/ISHKernel.m ../../src/ios/iSH/ISHShellExecutor.m \
             ../../src/ios/iSH/CurrentRoot.m ios/ish_host/
          # The kernel imports ~20 native-offload headers that only exist in the
          # host app (FFmpeg/HealthKit/HomeKit/... offloads). None of their
          # register functions are called from this file, so dropping the
          # imports keeps the kernel compiling in the Flutter runner.
          sed -i '' -e '/#import ".*Offload\.h"/d' ios/ish_host/ISHKernel.m
          # Their register calls go too: the Flutter runner has no offloads.
          sed -i '' -e '/_offload_register();/d' ios/ish_host/ISHKernel.m
          sed -i '' -e 's|#import "../Diagnostics/CrashSignalHandler.h"|#import "CrashSignalHandler.h"|' \
                     -e 's|#import "../Diagnostics/CrashSignalPolicy.h"|#import "CrashSignalPolicy.h"|' \
                     -e 's|#import "Minis-Swift.h"|#import "Minis-Swift.h"|' \
                     ios/ish_host/ISHKernel.m
          ls ios/ish_host
          grep -q ISHHost ios/Podfile || printf "  pod 'ISHHost', :path => './ish_host'\n" >> ios/Podfile
          # Local pods are not auto-registered by GeneratedPluginRegistrant.
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('ios/Runner/AppDelegate.swift')
          s = p.read_text()
          if 'AmoreNativePlugin' not in s:
              s = s.replace('import Flutter', 'import Flutter\nimport ISHHost')
              s = s.replace('return super.application(application, didFinishLaunchingWithOptions: launchOptions)',
                            'if let reg = self.registrar(forPlugin: "AmoreNativePlugin") {\n'
                            '        AmoreNativePlugin.register(with: reg)\n'
                            '    }\n'
                            '    return super.application(application, didFinishLaunchingWithOptions: launchOptions)')
              p.write_text(s)
              print('AppDelegate patched')
          else:
              print('AppDelegate already patched')
          PY
          cd ios && pod install

      - name: Build app (unsigned)
        working-directory: src/flutter_skeleton/app
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build > xcodebuild.log 2>&1 || true
          echo "=== first errors ==="
          grep -n -m 25 "error:" xcodebuild.log || true
          echo "=== tail ==="
          tail -25 xcodebuild.log
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: Package IPA
        working-directory: src/flutter_skeleton/app
        run: |
          set -e
          APP=$(find build/ios/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "Found: $APP"
          rm -rf Payload && mkdir -p Payload && cp -r "$APP" Payload/
          zip -r -y Amore-Flutter.ipa Payload
          ls -lh Amore-Flutter.ipa
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: amore-flutter-ipa
          path: src/flutter_skeleton/app/Amore-Flutter.ipa
          if-no-files-found: error
          retention-days: 14
