name: Amore1.41 original UI with fast icons
'on':
  workflow_dispatch:
    inputs:
      source_sha: {required: true, type: string}
permissions: {contents: read}
jobs:
  ui:
    name: Actual first-frame icons and chat controls
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          repository: at9870451-bit/OpenMinis
          ref: ${{ inputs.source_sha }}
      - name: Compile actual fast icon view and original composer
        env:
          AMORE134_TEST_LOG: ${{ github.workspace }}/amore141-ui.log
          AMORE134_SNAPSHOTS: ${{ github.workspace }}/amore141-snapshots
          AMORE_TEST_ONLY: |
            Amore134Tests
            Amore134NavigationUITests/Amore135HeaderUITests
            Amore134NavigationUITests/Amore138ComposerUITests
        run: |
          python3 scripts/test-amore141-firstframe.py
          bash scripts/test-amore138-components.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amore141-ui-results
          path: |
            amore141-ui.log
            amore141-snapshots
          if-no-files-found: warn
