name: Amore1.35 focused final checks
on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  components:
    name: Final submenu and glass portrait checks
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          repository: at9870451-bit/OpenMinis
          ref: ${{ inputs.source_sha }}
      - name: Exact original submenu action and real glass snapshots
        env:
          AMORE134_TEST_LOG: ${{ github.workspace }}/amore135-focused.log
          AMORE134_SNAPSHOTS: ${{ github.workspace }}/amore135-focused-snapshots
          AMORE_TEST_ONLY: |
            Amore134Tests
            Amore134NavigationUITests/Amore135HeaderUITests/testSpeedAndKeepScreenOnSubmenusUseRealMenuActions
        run: bash scripts/test-amore134-components.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amore135-focused-evidence
          path: |
            amore135-focused.log
            amore135-focused-snapshots
          if-no-files-found: warn
