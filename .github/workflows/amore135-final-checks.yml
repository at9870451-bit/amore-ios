name: Amore1.35 final interaction acceptance
on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  components:
    name: Real 1.35 final UI acceptance
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          repository: at9870451-bit/OpenMinis
          ref: ${{ inputs.source_sha }}
      - name: Actual production menu footer avatar glass and navigation
        env:
          AMORE134_TEST_LOG: ${{ github.workspace }}/amore135-components.log
          AMORE134_SNAPSHOTS: ${{ github.workspace }}/amore135-component-snapshots
        run: bash scripts/test-amore134-components.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amore135-components
          path: |
            amore135-components.log
            amore135-component-snapshots
          if-no-files-found: warn
          retention-days: 14
